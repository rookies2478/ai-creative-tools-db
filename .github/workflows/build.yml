name: Build

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: "package.json"
          cache: npm

      - run: npm ci

      - name: Validate affiliate links
        run: npm run validate:affiliate-links

      - name: Verify PR task, committed-file scope, and whitespace
        if: github.event_name == 'pull_request'
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          npm run validate:task
          npm run validate:scope
          git diff --check "$PR_BASE_SHA" HEAD
          node --input-type=module <<'NODE'
          import { readdirSync, readFileSync } from 'node:fs';
          import { execFileSync } from 'node:child_process';
          const fs = readdirSync('docs/tasks/active').filter(x=>x.endsWith('.md')&&x!=='README.md');
          if (fs.length!==1) throw Error('Expected exactly one active task');
          const doc = readFileSync('docs/tasks/active/'+fs[0], 'utf8');
          const block = doc.match(/^target_files:\n((?:  - [^\n]+\n)+)/m)?.[1];
          if (!block) throw Error('Task has no exact-path target_files');
          const allow = new Set(block.trim().split('\n').map(x=>x.trim().slice(2).trim().replace(/^['\"]|['\"]$/g,'')));
          const changed = execFileSync('git',['diff','--name-only',process.env.PR_BASE_SHA,'HEAD'],{encoding:'utf8'}).trim().split('\n').filter(Boolean);
          const out = changed.filter(x=>!allow.has(x));
          if (out.length) throw Error('Out-of-scope committed changes: '+out.join(', '));
          console.log('PASS: '+changed.length+' PR files match active task target_files');
          NODE
      - name: Validate tool data
        run: npm run validate:data

      - name: Audit CTA tracking
        run: |
          npm run audit:cta:test
          npm run audit:cta

      - name: Build site
        run: npm run build

      - name: Validate published output
        run: npm run validate:publish

      - name: Regression - Fotor static HTML includes latest intent section
        run: node scripts/verify-fotor-intent-output.mjs
