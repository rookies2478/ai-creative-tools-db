name: Monitor approved published release
on:
  workflow_dispatch:
  schedule:
    - cron: '43 1 * * *'
permissions:
  contents: read
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify published SHA, repository ancestry and HTTP
        run: node scripts/monitor-published-release.mjs
