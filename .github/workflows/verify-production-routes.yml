name: Verify production routes

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-production-routes
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify every sitemap URL on production
        env:
          SITE_ORIGIN: https://aicreative-db.com
          QA_PROFILE: creative
        run: node scripts/verify-production-routes.mjs
